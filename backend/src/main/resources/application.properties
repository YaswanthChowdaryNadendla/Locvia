# ===================================================================
# Locvia Backend Application Configuration (Module 46)
# ===================================================================

# Application Identity & Server Port
spring.application.name=locvia-backend
server.port=8080

# MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:locvia_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:yash}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP Connection Pool — tuned for Aiven MySQL over WAN (Render free tier)
# keepalive-time: sends periodic JDBC keepalive to prevent NAT/firewall dropping idle connections
# max-lifetime: recycles connections before server-side timeout kills them
# minimum-idle: keeps 2 warm connections ready so first post-idle request doesn't incur full reconnect
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000

# JWT & Security Configuration (Module 48)
locvia.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
locvia.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration (Vite React Frontend + Vercel Production)
# LOCVIA_CORS_ALLOWED_ORIGINS env var overrides this on Render; includes Vercel as a safe default
locvia.cors.allowed-origins=${LOCVIA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://locvia-platform.vercel.app}

# Cloudinary Configuration (Module 52)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart File Upload Configuration (5 MB per file, 10 MB total request)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.root=INFO
logging.level.com.locvia=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.org.hibernate.SQL=WARN

# Resend Email Service Configuration (Forgot Password OTP)
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:}
resend.from-name=${RESEND_FROM_NAME:Locvia}

# Google Identity Services Configuration
locvia.google.client-id=${GOOGLE_CLIENT_ID:}

